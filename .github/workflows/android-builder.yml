name: Build Production Android App with Live Ads

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Prepare Web Assets
      run: |
        mkdir -p dist
        cp index.html styles.css script.js dist/
        # Copy audio assets — required for in-app music and sound effects
        cp bg-music.mp3 correct-answer.mp3 wrong-answer.mp3 dist/

    - name: Create Capacitor Config
      run: |
        printf '{\n  "appId": "com.ayush.mathsriddle",\n  "appName": "Math Riddles",\n  "webDir": "dist",\n  "bundledWebRuntime": false\n}\n' > capacitor.config.json

    - name: Add & Sync Capacitor Android
      run: |
        # Only add android platform if it hasn't been added yet
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Inject AdMob App ID into Manifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-1825832964235064~3094905301\"/>\n    </application>|' "$MANIFEST"
          fi
        fi

    - name: Inject Namespace into build.gradle
      run: |
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          if ! grep -q "namespace" "$GRADLE"; then
            sed -i '/android {/a\    namespace "com.ayush.mathsriddle"' "$GRADLE"
          fi
        fi

    - name: Build Unsigned Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Clean up App Filename
      run: |
        # Safely renames the compiled file directly in its output directory
        mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/Math-Riddles.apk

    - name: Upload Clean Production APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: Math-Riddles-Build
        path: android/app/build/outputs/apk/release/Math-Riddles.apk
