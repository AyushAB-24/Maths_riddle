name: Build Production Android App with Live Ads

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Prepare Web Assets
      run: |
        mkdir -p dist
        cp index.html styles.css script.js dist/
        # Safely copy internal audio assets if they exist in your root directory
        cp bg-music.mp3 correct-answer.mp3 wrong-answer.mp3 dist/ 2>/dev/null || true

    - name: Create Capacitor Config
      run: |
        printf '{\n  "appId": "com.ayush.mathsriddle",\n  "appName": "Math Riddles",\n  "webDir": "dist",\n  "bundledWebRuntime": false\n}\n' > capacitor.config.json

    - name: Add & Sync Capacitor Android (First)
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Inject AdMob App ID into Manifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-1825832964235064~3094905301\"/>\n    </application>|' "$MANIFEST"
          fi
        fi

    - name: Inject Namespace and Enforce Signing in build.gradle
      run: |
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          # Inject project package namespace if missing
          if ! grep -q "namespace" "$GRADLE"; then
            sed -i '/android {/a\    namespace "com.ayush.mathsriddle"' "$GRADLE"
          fi
          # Force the release compiler to use standard default signing blocks so it creates a clean file
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' "$GRADLE" || true
        fi

    - name: Build Production Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Locate and Secure Built App Binary
      run: |
        mkdir -p final-artifact
        # Recursively scan the entire output tree for the newly built package and copy it over safely
        find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} final-artifact/Math-Riddles-Production.apk \;

    - name: Upload Production APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: Production-APK
        path: final-artifact/Math-Riddles-Production.apk
