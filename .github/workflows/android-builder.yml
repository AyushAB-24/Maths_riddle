name: Build Modern Android App
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Project Framework
      run: |
        rm -rf package.json package-lock.json node_modules
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @babel/core @babel/cli @babel/preset-env

    - name: Compile and Transpile Modern JS Syntax
      run: |
        npx babel script.js --out-file compiled_script.js --presets=@babel/preset-env
        sed 's/<\/head>/<script src="cordova.js"><\/script><\/head>/g' index.html > fixed_index.html

    - name: Construct Native App Bundle Directory
      run: |
        mkdir dist
        cp fixed_index.html dist/index.html
        cp styles.css dist/styles.css
        cp compiled_script.js dist/script.js
        cp *.mp3 dist/ 2>/dev/null || true

        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ayush.mathsriddle",
          "appName": "Math Riddles",
          "webDir": "dist"
        }
        EOF

    - name: Build Android Workspace Environments
      run: |
        npm install @capacitor/android@6.0.0 @capacitor-community/admob@6.0.0
        npx cap add android
        npx cap sync android

    - name: Inject AdMob Credentials and Namespace Fix
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
        fi
        
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          sed -i '/android {/a \    namespace "com.ayush.mathsriddle"' "$GRADLE"
        fi

    - name: Compile Unsigned Release APK File
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Generate Key and Sign the APK for Mobile Testing
      run: |
        cd android/app/build/outputs/apk/release/
        
        # 1. Create a temporary local keystore signature
        keytool -genkey -v -keystore test.keystore -alias test_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Ayush, OU=Development, O=MathRiddles, L=Pune, S=MH, C=IN"
        
        # 2. Sign the unsigned build artifact so Android devices accept it as valid
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore test.keystore -storepass password app-release-unsigned.apk test_alias
        
        # 3. Rename it to clearly mark it as signed and test-ready
        mv app-release-unsigned.apk math-riddles-signed.apk

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-apk
        path: android/app/build/outputs/apk/release/math-riddles-signed.apk
