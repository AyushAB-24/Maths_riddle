name: Build Android App Wrapper
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dynamically Initialize Project Architecture
      run: |
        # Clear legacy locks to prevent package collisions
        rm -rf package.json package-lock.json node_modules
        
        # Build clean core declarations
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0
        
        # Create base profile link
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ayush.mathsriddle",
          "appName": "Math Riddles",
          "webDir": "."
        }
        EOF

    - name: Construct Android Native Architecture
      run: |
        npm install @capacitor/android@6.0.0
        npx cap add android

    - name: Install and Register AdMob Library Packages
      run: |
        # Install the extension
        npm install @capacitor-community/admob@6.0.0 --save-exact
        
        # Sync immediately to write the native bridge hooks
        npx cap sync android

    - name: Inject AdMob App ID and Fix Android Namespace Config
      run: |
        # 1. Inject the AdMob application metadata tag into AndroidManifest
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
        else
          echo "Error: AndroidManifest.xml missing!" && exit 1
        fi
        
        # 2. Fix the missing namespace requirement for modern build systems
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          sed -i '/android {/a \    namespace "com.ayush.mathsriddle"' "$GRADLE"
        else
          echo "Error: build.gradle missing!" && exit 1
        fi

    - name: Compile Unsigned Release APK File
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
