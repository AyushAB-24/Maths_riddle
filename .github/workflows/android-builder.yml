name: Build Production Android App with Live Ads

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Prepare Web Assets
      run: |
        mkdir -p dist
        cp index.html styles.css script.js dist/
        # Robust audio check: Handles case differences dynamically
        find . -maxdepth 3 -iname "bg-music.mp3" -exec cp {} dist/bg-music.mp3 \;
        find . -maxdepth 3 -iname "correct-answer.mp3" -exec cp {} dist/correct-answer.mp3 \;
        find . -maxdepth 3 -iname "wrong-answer.mp3" -exec cp {} dist/wrong-answer.mp3 \;

    - name: Create Capacitor Config
      run: |
        printf '{\n  "appId": "com.ayush.mathsriddle",\n  "appName": "Math Riddles",\n  "webDir": "dist",\n  "bundledWebRuntime": false\n}\n' > capacitor.config.json

    - name: Add & Sync Capacitor Android
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Inject AdMob App ID and Billing Permission into Manifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          # Inject AdMob Meta-Data safely right before the closing application tag if missing
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1825832964235064~3094905301"/>\n    </application>|' "$MANIFEST"
          fi
          
          # Inject Google Play In-App Purchasing Permission safely right before the opening application tag starts
          if ! grep -q "com.android.vending.BILLING" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="com.android.vending.BILLING"/>\n    <application|' "$MANIFEST"
          fi
        fi

    - name: Inject Namespace into build.gradle
      run: |
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          if ! grep -q "namespace" "$GRADLE"; then
            sed -i '/android {/a\    namespace "com.ayush.mathsriddle"' "$GRADLE"
          fi
        fi

    - name: Update Version to 4.0 (Version Code 4)
      run: |
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          sed -i 's/versionCode [0-9]*/versionCode 4/g' "$GRADLE"
          sed -i 's/versionName "[0-9.]*"/versionName "4.0"/g' "$GRADLE"
        fi

    - name: Compile Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-live-ads-v4
        path: android/app/build/outputs/apk/debug/app-debug.apk
