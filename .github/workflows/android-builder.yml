name: Build Production Android App with Live Ads
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Project Framework
      run: |
        rm -rf package.json package-lock.json node_modules
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @babel/core @babel/cli @babel/preset-env

    - name: Compile and Transpile Modern JS Syntax
      run: |
        npx babel script.js --out-file compiled_script.js --presets=@babel/preset-env
        sed 's/<\/head>/<script src="cordova.js"><\/script><\/head>/g' index.html > fixed_index.html

    - name: Construct Native App Bundle Directory
      run: |
        mkdir dist
        cp fixed_index.html dist/index.html
        cp styles.css dist/styles.css
        cp compiled_script.js dist/script.js
        cp *.mp3 dist/ 2>/dev/null || true

        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ayush.mathsriddle",
          "appName": "Math Riddles",
          "webDir": "dist"
        }
        EOF

    - name: Build Android Workspace Environments
      run: |
        npm install @capacitor/android@6.0.0 @capacitor-community/admob@6.0.0
        npx cap add android
        npx cap sync android

    - name: Inject Production AdMob Credentials and Namespace Fix
      run: |
        # 1. Inject your real live AdMob App ID into the Manifest file
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1825832964235064~3094905301"/>' "$MANIFEST"
        fi
        
        # 2. Update your Banner Unit ID dynamically inside your JavaScript asset code
        sed -i 's|adId:[[:space:]]*["'\''][^"'\'']*["'\'']|adId: "ca-app-pub-1825832964235064/9289493815"|g' dist/script.js
        
        # 3. Append the production initialization sequence to the asset package execution stack
        cat <<EOF >> dist/script.js

        // Automated Production Global Framework Handler
        document.addEventListener('deviceready', async () => {
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
              const AdMob = window.Capacitor.Plugins.AdMob;
              await AdMob.initialize({ initializeForTesting: false });
              await AdMob.showBanner({
                adId: 'YOUR_LIVE_BANNER_UNIT_ID_HERE',
                adSize: 'BANNER',
                position: 'BOTTOM_CENTER',
                margin: 0,
                isTesting: false
              });
              console.log("Production AdMob framework initialized.");
            }
          } catch (e) {
            console.error("AdMob production initialization exception:", e);
          }
        });
        EOF

        npx cap sync android
        
        # 4. Apply the Android system compilation namespace fix
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          sed -i '/android {/a \    namespace "com.ayush.mathsriddle"' "$GRADLE"
        fi

    - name: Compile Autographed Debug APK File
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-live-ads-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
