name: Build Android App with Test Ads
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Project Framework
      run: |
        rm -rf package.json package-lock.json node_modules
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @babel/core @babel/cli @babel/preset-env

    - name: Compile and Transpile Modern JS Syntax
      run: |
        npx babel script.js --out-file compiled_script.js --presets=@babel/preset-env
        sed 's/<\/head>/<script src="cordova.js"><\/script><\/head>/g' index.html > fixed_index.html

    - name: Construct Native App Bundle Directory
      run: |
        mkdir dist
        cp fixed_index.html dist/index.html
        cp styles.css dist/styles.css
        cp compiled_script.js dist/script.js
        cp *.mp3 dist/ 2>/dev/null || true

        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ayush.mathsriddle",
          "appName": "Math Riddles",
          "webDir": "dist"
        }
        EOF

    - name: Build Android Workspace Environments
      run: |
        npm install @capacitor/android@6.0.0 @capacitor-community/admob@6.0.0
        npx cap add android
        npx cap sync android

    - name: Inject Google Test Ads and Namespace Fix
      run: |
        # 1. Inject the standard Google Test App ID into the Manifest
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
        fi
        
        # 2. Force-replace any hardcoded banner strings in your JS with the Google Test Banner ID
        sed -i 's|adId:[[:space:]]*["'\''][^"'\'']*["'\'']|adId: "ca-app-pub-3940256099942544/6300978111"|g' dist/script.js
        npx cap sync android
        
        # 3. Apply the system compilation namespace fix
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          sed -i '/android {/a \    namespace "com.ayush.mathsriddle"' "$GRADLE"
        fi

    - name: Compile Unsigned Release APK File
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Generate Local Keystore and Production Sign App
      run: |
        cd android/app/build/outputs/apk/release/
        
        # Generates a fresh structural verification signature profile template
        keytool -genkey -v -keystore test-ads.keystore -alias test_ads_alias -keyalg RSA -keysize 2048 -validity 20000 -storepass testpass123 -keypass testpass123 -dname "CN=Ayush, OU=Testing, O=MathRiddles, L=Pune, S=MH, C=IN"
        
        # Signs the app using modern v2 signature protocols so your phone accepts it instantly
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore test-ads.keystore -storepass testpass123 app-release-unsigned.apk test_ads_alias
        
        mv app-release-unsigned.apk math-riddles-test-ads.apk

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-test-apk
        path: android/app/build/outputs/apk/release/math-riddles-test-ads.apk
