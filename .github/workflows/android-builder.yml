name: Build Android App Wrapper
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dynamically Initialize Project Architecture
      run: |
        # Wipe old configuration fragments to prevent package clashes
        rm -rf package.json package-lock.json node_modules
        
        # Build clean core declarations
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0
        
        # Create the local environment profile link securely
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ayush.mathsriddle",
          "appName": "Math Riddles",
          "webDir": "."
        }
        EOF

    - name: Install Verified AdMob Library Ecosystem
      run: |
        # Force exact execution versions matching the compiler environment
        npm install @capacitor-community/admob@6.0.0 --save-exact

    - name: Construct Android Native Architecture
      run: |
        npm install @capacitor/android@6.0.0
        npx cap add android

    - name: Inject AdMob App ID into Android Manifest Config
      run: |
        FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$FILE" ]; then
          # Safe injection of placeholder AdMob App ID right before the closing application tag
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$FILE"
        else
          echo "Error: AndroidManifest.xml missing!" && exit 1
        fi

    - name: Synchronize Game Assets to App Package
      run: npx cap sync android

    - name: Compile Unsigned Release APK File
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
