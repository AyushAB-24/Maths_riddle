name: Build Production Android App with Live Ads
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize and Prepare Build
      run: |
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor-community/admob@6.0.0
        
        # Create web directory for build
        mkdir -p dist
        cp index.html dist/index.html
        cp styles.css dist/styles.css
        cp script.js dist/script.js
        
        # Create config file
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ayush.mathsriddle",
          "appName": "Math Riddles",
          "webDir": "dist",
          "bundledWebRuntime": false
        }
        EOF

    - name: Sync Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Inject AdMob and Namespace Fixes
      run: |
        # 1. Inject AdMob ID into Manifest
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1825832964235064~3094905301"/>' "$MANIFEST"
        fi
        
        # 2. Inject Namespace into build.gradle
        GRADLE="android/app/build.gradle"
        if [ -f "$GRADLE" ]; then
          # Check if namespace exists to avoid duplication
          if ! grep -q "namespace" "$GRADLE"; then
            sed -i '/android {/a \    namespace "com.ayush.mathsriddle"' "$GRADLE"
          fi
        fi

    - name: Compile APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-live-ads
        path: android/app/build/outputs/apk/debug/app-debug.apk
