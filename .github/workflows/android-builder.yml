name: Build Android App with Cordova
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Cordova CLI Global Tool
      run: npm install -g cordova

    - name: Initialize Clean Cordova App Shell
      run: |
        cordova create math-app com.ayush.mathsriddle "Math Riddles"
        cd math-app
        cordova platform add android@10.1.2
        rm -rf www/*

    - name: Prepare HTML with Native Injection Layer
      run: |
        # This safely injects the cordova.js script tag right before the closing </head> tag 
        # WITHOUT altering any of your actual UI containers, styles, or logic definitions.
        sed 's/<\/head>/<script src="cordova.js"><\/script><\/head>/g' index.html > fixed_index.html

    - name: Synchronize Original Web Files
      run: |
        # Copy your pristine assets safely into Cordova's delivery layer
        cp fixed_index.html math-app/www/index.html
        cp styles.css math-app/www/
        cp script.js math-app/www/
        
        # Copy audio assets if present
        cp *.mp3 math-app/www/ 2>/dev/null || true

    - name: Install the Cordova AdMob Plugin Wrapper
      run: |
        cd math-app
        cordova plugin add cordova-plugin-admob-plus --variable APP_ID_ANDROID="ca-app-pub-3940256099942544~3347511713" --save

    - name: Compile Production APK File
      run: |
        cd math-app
        cordova build android --release --no-telemetry

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-apk
        path: math-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
