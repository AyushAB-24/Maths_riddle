name: Build Android App with Cordova
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova CLI Global Tool
      run: npm install -g cordova

    - name: Initialize Clean Cordova App Shell
      run: |
        # Create a fresh app wrapper project structure
        cordova create math-app com.ayush.mathsriddle "Math Riddles"
        cd math-app
        
        # Add the Android workspace engine template
        cordova platform add android@12.0.0
        
        # Clear out default templates in the asset directory
        rm -rf www/*

    - name: Synchronize Original Web Files
      run: |
        # Copy your completely untouched original code assets into Cordova's delivery layer
        cp -r index.html styles.css script.js www/
        
        # Copy audio assets if they exist in your root directory
        cp *.mp3 www/ 2>/dev/null || true

    - name: Install the Cordova AdMob Plugin Wrapper
      run: |
        cd math-app
        # This installs the global AdMob API which maps perfectly to 'AdMob' keywords in your JS layer
        cordova plugin add cordova-plugin-admob-plus --variable APP_ID_ANDROID="ca-app-pub-3940256099942544~3347511713"

    - name: Compile Production APK File
      run: |
        cd math-app
        # Build the final installation package bundle
        cordova build android --release --no-telemetry

    - name: Package Completed Application Target Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-riddles-apk
        path: math-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
